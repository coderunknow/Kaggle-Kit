# Nightly prerelease automation for Kaggle-Kit.
#
# Schedule: 19:00 UTC every day, which is 02:00 in Asia/Ho_Chi_Minh (UTC+7).
# Scheduled runs verify and stage artifacts only. Publication is an explicit
# workflow_dispatch opt-in (`publish_nightly: true`):
#   nightly-YYYYMMDD-<run_id>-<attempt>

name: Nightly Release

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      publish_nightly:
        description: 'Publish the validated nightly prerelease (defaults to verification only)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  verify:
    name: validate nightly build inputs and artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve nightly metadata
        id: meta
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DATE_LOCAL="$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)"
          TAG="nightly-${DATE_LOCAL}-${RUN_ID}-${RUN_ATTEMPT}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$SOURCE_SHA" != "$SOURCE_SHA_INPUT" ]; then
            echo "The checkout SHA $SOURCE_SHA differs from the triggering SHA $SOURCE_SHA_INPUT." >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^nightly-[0-9]{8}-[0-9]+-[0-9]+$'; then
            echo "Generated nightly tag is invalid: $TAG" >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ ! -f "docs/release-notes/$VERSION.md" ]; then
            printf '%s\n' \
              "# Nightly validation note for $VERSION" \
              "" \
              "Generated by .github/workflows/nightly-release.yml for validator compatibility." \
              "Commit: {{SOURCE_SHA}}" \
              > "docs/release-notes/$VERSION.md"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly tag: $TAG"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          python3 -m pip install --upgrade requests

      - name: Validate source checks
        run: |
          set -euo pipefail
          python3 tools/run_checks.py --output checks.json \
            --command "npm run typecheck" \
            --command "npm run lint" \
            --command "npm test" \
            --command "python3 -m unittest discover -s notebooks -p 'test_*.py'" \
            --command "python3 -m unittest discover -s tools -p 'test_*.py'"

      - name: Build and integration check
        run: |
          set -euo pipefail
          npm run build
          npm run check:integration

      - name: Stage nightly artifacts
        id: stage
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          STAGE="release"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          python3 tools/build_notebook.py \
            --source notebooks/qwen3_8_27b_api.py \
            --output "$STAGE/$TAG-notebook.ipynb" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"

          APP_DIR="$STAGE/app"
          mkdir -p "$APP_DIR/dist"
          cp -r dist/client "$APP_DIR/dist/client"
          mkdir -p "$APP_DIR/dist/server"
          cp dist/server/index.js "$APP_DIR/dist/server/index.js"
          cp package.json "$APP_DIR/package.json"
          cp README.md "$APP_DIR/README.md"
          cp LICENSE "$APP_DIR/LICENSE"
          mkdir -p "$APP_DIR/scripts" "$APP_DIR/tools" "$APP_DIR/docs"
          cp scripts/start-windows.ps1 "$APP_DIR/scripts/start-windows.ps1"
          cp tools/launcher.mjs "$APP_DIR/tools/launcher.mjs"
          cp docs/windows-launcher.md "$APP_DIR/docs/windows-launcher.md"
          printf '%s\n' \
            'Kaggle-Kit application bundle' \
            '' \
            'Windows (one command):' \
            '  powershell -ExecutionPolicy Bypass -File .\\scripts\\start-windows.ps1' \
            '' \
            'Any platform:' \
            '  node dist/server/index.js' \
            '' \
            'The backend serves the built client and the API on http://127.0.0.1:8787.' \
            'It has no runtime dependencies, so node_modules is not required.' \
            'Set KAGGLE_KIT_PORT, KAGGLE_KIT_HOST, KAGGLE_KIT_ALLOWED_HOSTS or' \
            'KAGGLE_KIT_BLOCK_PRIVATE_NETWORKS to change the defaults.' \
            > "$APP_DIR/README-RUN.txt"
          ( cd "$APP_DIR" && zip -qr "../$TAG-app.zip" . )
          rm -rf "$APP_DIR"

          git archive --format=zip --prefix="kaggle-kit-$VERSION/" \
            -o "$STAGE/$TAG-source.zip" "$SOURCE_SHA"

          python3 tools/build_release_report.py \
            --stage "$STAGE" \
            --checks checks.json \
            --environment docs/release/environment.json \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --output "$STAGE/verification-report.json"

          python3 tools/build_manifest.py \
            --stage "$STAGE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --output "$STAGE/manifest.json" \
            --checksums "$STAGE/SHA256SUMS"

      - name: Validate staged nightly artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 tools/validate_release.py \
            --stage release \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_nightly == true
    name: publish nightly prerelease
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out the triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve nightly metadata
        id: meta
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA_INPUT: ${{ github.sha }}
        run: |
          set -euo pipefail
          DATE_LOCAL="$(TZ=Asia/Ho_Chi_Minh date +%Y%m%d)"
          TAG="nightly-${DATE_LOCAL}-${RUN_ID}-${RUN_ATTEMPT}"
          SOURCE_SHA="$(git rev-parse HEAD)"
          if [ "$SOURCE_SHA" != "$SOURCE_SHA_INPUT" ]; then
            echo "The checkout SHA $SOURCE_SHA differs from the triggering SHA $SOURCE_SHA_INPUT." >&2
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -Eq '^nightly-[0-9]{8}-[0-9]+-[0-9]+$'; then
            echo "Generated nightly tag is invalid: $TAG" >&2
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          if [ ! -f "docs/release-notes/$VERSION.md" ]; then
            printf '%s\n' \
              "# Nightly validation note for $VERSION" \
              "" \
              "Generated by .github/workflows/nightly-release.yml for validator compatibility." \
              "Commit: {{SOURCE_SHA}}" \
              > "docs/release-notes/$VERSION.md"
          fi
          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "source_sha=$SOURCE_SHA"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly tag: $TAG"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          python3 -m pip install --upgrade requests

      - name: Validate source checks
        run: |
          set -euo pipefail
          python3 tools/run_checks.py --output checks.json \
            --command "npm run typecheck" \
            --command "npm run lint" \
            --command "npm test" \
            --command "python3 -m unittest discover -s notebooks -p 'test_*.py'" \
            --command "python3 -m unittest discover -s tools -p 'test_*.py'"

      - name: Build and integration check
        run: |
          set -euo pipefail
          npm run build
          npm run check:integration

      - name: Stage nightly artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          STAGE="release"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          python3 tools/build_notebook.py \
            --source notebooks/qwen3_8_27b_api.py \
            --output "$STAGE/$TAG-notebook.ipynb" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"

          APP_DIR="$STAGE/app"
          mkdir -p "$APP_DIR/dist"
          cp -r dist/client "$APP_DIR/dist/client"
          mkdir -p "$APP_DIR/dist/server"
          cp dist/server/index.js "$APP_DIR/dist/server/index.js"
          cp package.json "$APP_DIR/package.json"
          cp README.md "$APP_DIR/README.md"
          cp LICENSE "$APP_DIR/LICENSE"
          mkdir -p "$APP_DIR/scripts" "$APP_DIR/tools" "$APP_DIR/docs"
          cp scripts/start-windows.ps1 "$APP_DIR/scripts/start-windows.ps1"
          cp tools/launcher.mjs "$APP_DIR/tools/launcher.mjs"
          cp docs/windows-launcher.md "$APP_DIR/docs/windows-launcher.md"
          printf '%s\n' \
            'Kaggle-Kit application bundle' \
            '' \
            'Windows (one command):' \
            '  powershell -ExecutionPolicy Bypass -File .\\scripts\\start-windows.ps1' \
            '' \
            'Any platform:' \
            '  node dist/server/index.js' \
            '' \
            'The backend serves the built client and the API on http://127.0.0.1:8787.' \
            'It has no runtime dependencies, so node_modules is not required.' \
            'Set KAGGLE_KIT_PORT, KAGGLE_KIT_HOST, KAGGLE_KIT_ALLOWED_HOSTS or' \
            'KAGGLE_KIT_BLOCK_PRIVATE_NETWORKS to change the defaults.' \
            > "$APP_DIR/README-RUN.txt"
          ( cd "$APP_DIR" && zip -qr "../$TAG-app.zip" . )
          rm -rf "$APP_DIR"

          git archive --format=zip --prefix="kaggle-kit-$VERSION/" \
            -o "$STAGE/$TAG-source.zip" "$SOURCE_SHA"

          python3 tools/build_release_report.py \
            --stage "$STAGE" \
            --checks checks.json \
            --environment docs/release/environment.json \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --output "$STAGE/verification-report.json"

          python3 tools/build_manifest.py \
            --stage "$STAGE" \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --output "$STAGE/manifest.json" \
            --checksums "$STAGE/SHA256SUMS"

      - name: Validate staged nightly artifacts
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail
          python3 tools/validate_release.py \
            --stage release \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA"

      - name: Publish nightly prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "The nightly tag $TAG already exists on origin. Refusing to overwrite." >&2
            exit 1
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [ "$PRERELEASE" != "true" ] || [ "$DRAFT" != "false" ]; then
              echo "Release $TAG exists with unexpected state (prerelease=$PRERELEASE, draft=$DRAFT)." >&2
            else
              echo "Release $TAG already exists as a published prerelease. Nightly tags must be unique per run." >&2
            fi
            exit 1
          fi

          NOTES_FILE="nightly-release-notes.md"
          printf '%s\n' \
            "Nightly prerelease built by .github/workflows/nightly-release.yml" \
            "" \
            "- Tag: $TAG" \
            "- Source commit: $SOURCE_SHA" \
            "- Package version: $VERSION" \
            "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > "$NOTES_FILE"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$TAG" \
            --prerelease \
            --notes-file "$NOTES_FILE"

          for asset in "$TAG-notebook.ipynb" "$TAG-app.zip" "$TAG-source.zip" manifest.json SHA256SUMS verification-report.json; do
            [ -f "release/$asset" ] || { echo "Missing asset release/$asset" >&2; exit 1; }
            gh release upload "$TAG" "release/$asset" --repo "$GITHUB_REPOSITORY"
          done

      - name: Verify published nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          set -euo pipefail

          IS_PRERELEASE="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
          IS_DRAFT="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [ "$IS_PRERELEASE" != "true" ] || [ "$IS_DRAFT" != "false" ]; then
            echo "Release $TAG is not a published prerelease." >&2
            exit 1
          fi

          git fetch --force --tags origin
          TAG_SHA="$(git rev-list -n 1 "$TAG")"
          if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
            echo "Tag $TAG points to $TAG_SHA, expected $SOURCE_SHA." >&2
            exit 1
          fi

          rm -rf downloaded
          mkdir -p downloaded
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded

          python3 tools/validate_release.py \
            --stage release \
            --version "$VERSION" \
            --tag "$TAG" \
            --source-sha "$SOURCE_SHA" \
            --downloaded downloaded
